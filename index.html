
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de productos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6 text-gray-800">

    <main class="mx-auto max-w-5xl">
        <h1 class="mb-2 text-2xl font-bold">Gestión de productos</h1>
        <p class="mb-6">Agregá y administrá tus productos.</p>

        <section class="mb-8 bg-white border border-gray-300 p-5">
            <h2 class="mb-4 text-lg font-bold">Nuevo producto</h2>

            <form id="producto-form" class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="codigo" class="mb-1 block">Código</label>
                    <input type="text" id="codigo" name="codigo" required
                        class="w-full border border-gray-300 bg-white p-2">
                </div>

                <div>
                    <label for="nombre" class="mb-1 block">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required
                        class="w-full border border-gray-300 bg-white p-2">
                </div>

                <div>
                    <label for="precio" class="mb-1 block">Precio</label>
                    <input type="number" id="precio" name="precio" min="0" step="0.01" required
                        class="w-full border border-gray-300 bg-white p-2">
                </div>

                <div>
                    <label for="imagen" class="mb-1 block">URL de la imagen</label>
                    <input type="url" id="imagen" name="imagen" required
                        class="w-full border border-gray-300 bg-white p-2">
                </div>

                <div class="sm:col-span-2">
                    <button type="submit"
                        class="bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
                        Agregar producto
                    </button>
                </div>
            </form>
        </section>

        <section class="border border-gray-300 bg-white p-5">
            <h2 class="mb-4 text-lg font-bold">Lista de productos</h2>

            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border border-gray-300 p-2">Código</th>
                            <th class="border border-gray-300 p-2">Nombre</th>
                            <th class="border border-gray-300 p-2">Precio</th>
                            <th class="border border-gray-300 p-2">Imagen</th>
                            <th class="border border-gray-300 p-2">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-productos">
                        <tr>
                            <td colspan="5" class="border border-gray-300 p-4 text-center">
                                Todavía no hay productos cargados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
